kind = "video"
videoAspectRatio = "16:9"
previewPath = "/p3-health-lab-film/"
title = "P3 Health Lab Film"
description = "A short animated brand film for P3 Health Lab about clean air, environmental health, and the places that shape wellbeing."
version = "1.0.0"
id = "artifacts/p3-health-lab-film"
router = "path"

[[services]]
name = "web"
paths = [ "/p3-health-lab-film/" ]
localPort = 21367

[services.development]
run = "pnpm --filter @workspace/p3-health-lab-film run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/p3-health-lab-film", "run", "build" ]
serve = "static"
publicDir = "artifacts/p3-health-lab-film/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21367"
BASE_PATH = "/p3-health-lab-film/"
