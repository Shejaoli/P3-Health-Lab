openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: admin
    description: Protected administration operations
  - name: public
    description: Publicly visible, validated site content
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /admin/auth/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Start an admin session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Authenticated admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionResponse"
        "401":
          description: Invalid credentials
  /admin/auth/session:
    get:
      operationId: adminSession
      tags: [admin]
      summary: Get the current admin session
      responses:
        "200":
          description: Authenticated admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionResponse"
        "401":
          description: No active session
  /admin/auth/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: End the current admin session
      responses:
        "200":
          description: Session ended
  /admin/content/{resource}:
    parameters:
      - $ref: "#/components/parameters/Resource"
    get:
      operationId: listAdminContent
      tags: [admin]
      summary: List protected content records
      responses:
        "200":
          description: Content records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentListResponse"
        "401":
          description: No active session
    post:
      operationId: createAdminContent
      tags: [admin]
      summary: Create a protected content record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentRecord"
      responses:
        "201":
          description: Created record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentRecord"
        "400":
          description: Invalid record
        "401":
          description: No active session
  /admin/content/{resource}/{id}:
    parameters:
      - $ref: "#/components/parameters/Resource"
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateAdminContent
      tags: [admin]
      summary: Update a protected content record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentRecord"
      responses:
        "200":
          description: Updated record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentRecord"
        "401":
          description: No active session
    delete:
      operationId: archiveAdminContent
      tags: [admin]
      summary: Archive a protected content record
      responses:
        "200":
          description: Archived record
        "401":
          description: No active session
  /admin/media/upload-url:
    post:
      operationId: requestAdminMediaUploadUrl
      tags: [admin]
      summary: Request a presigned image upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadRequest"
      responses:
        "200":
          description: Presigned upload details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResponse"
        "400":
          description: Invalid image metadata
        "401":
          description: No active session
  /admin/media/verify-upload:
    post:
      operationId: verifyAdminMediaUpload
      tags: [admin]
      summary: Verify an uploaded image before creating its media record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadVerificationRequest"
      responses:
        "200":
          description: Valid image
        "400":
          description: Invalid image
        "401":
          description: No active session
  /public/profile:
    get:
      operationId: getPublicProfile
      tags: [public]
      summary: Get verified public profile and contact information
      responses:
        "200":
          description: Public profile fields and safe external links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfileResponse"
        "500":
          description: Unable to load profile information
  /public/opportunities:
    get:
      operationId: getPublicOpportunities
      tags: [public]
      summary: List published, non-archived, visible opportunities
      responses:
        "200":
          description: Public opportunities, excluding administrative fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicOpportunitiesResponse"
        "500":
          description: Unable to load opportunities
  /public/teaching:
    get:
      operationId: getPublicTeaching
      tags: [public]
      summary: List published, non-archived teaching courses
      responses:
        "200":
          description: Public teaching courses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTeachingListing"
        "500":
          description: Unable to load teaching courses
components:
  parameters:
    Resource:
      name: resource
      in: path
      required: true
      schema:
        type: string
        enum: [people, projects, news, researchAreas, teaching, opportunities, profile, media]
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AdminSessionResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
    AdminUser:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        role:
          type: string
    ContentListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentRecord"
    ContentRecord:
      type: object
      additionalProperties: true
    MediaUploadRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
        size:
          type: integer
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/gif]
    MediaUploadResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
    MediaUploadVerificationRequest:
      type: object
      required: [objectPath, size, contentType]
      properties:
        objectPath:
          type: string
        size:
          type: integer
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/gif]
    PublicProfileResponse:
      type: object
      required: [externalLinks, contact]
      properties:
        externalLinks:
          type: array
          items:
            $ref: "#/components/schemas/PublicProfileLink"
        contact:
          $ref: "#/components/schemas/PublicContactProfile"
    PublicProfileLink:
      type: object
      required: [label, url]
      properties:
        label:
          type: string
        url:
          type: string
          format: uri
    PublicContactProfile:
      type: object
      required: [name, appointment, labName, directorRole, department, university, office, contactEmail, labEmail]
      properties:
        name:
          type: ["string", "null"]
        appointment:
          type: ["string", "null"]
        labName:
          type: ["string", "null"]
        directorRole:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        university:
          type: ["string", "null"]
        office:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
          format: email
        labEmail:
          type: ["string", "null"]
          format: email
    PublicOpportunitiesResponse:
      type: object
      required: [opportunities]
      properties:
        opportunities:
          type: array
          items:
            $ref: "#/components/schemas/PublicOpportunity"
    PublicOpportunity:
      type: object
      required: [title, category, shortDescription, fullDetails, applicationInstructions, applicationEmail, applicationUrl, deadline, status]
      properties:
        title:
          type: string
        category:
          type: string
          enum: [Graduate Students, Postdoctoral Researchers, "Research Assistants & Staff", "Undergraduate / Research Students", "Visiting Students & Scholars"]
        shortDescription:
          type: string
        fullDetails:
          type: string
        applicationInstructions:
          type: string
        applicationEmail:
          type: ["string", "null"]
          format: email
        applicationUrl:
          type: ["string", "null"]
          format: uri
        deadline:
          type: ["string", "null"]
          format: date
        status:
          type: string
          enum: [Open, Closed]
    PublicTeachingListing:
      type: object
      required: [courses]
      properties:
        courses:
          type: array
          items:
            $ref: "#/components/schemas/PublicTeachingCourse"
    PublicTeachingCourse:
      type: object
      required: [academicYear, courseCode, title]
      properties:
        academicYear:
          type: string
        courseCode:
          type: string
        title:
          type: string

